name: Build NextPlayer APK (auto sync upstream)

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "构建哪些 ABI。日常测试保持 v7a 即可（快）；正式版发布或确实需要全量时才选 all"
        type: choice
        options:
          - v7a
          - all
        default: v7a
  schedule:
    # 每月 1 号跑一次同步上游。日常构建一律手 workflow_dispatch，
    # 不要提速到每天：上游一有改动就会撞冲突，冲突时本 workflow 主动 exit 1
    # （见 Sync upstream 步骤），高频触发只会刷出一堆必然失败的记录。
    # 时区注意：cron 是 UTC，UTC 1 日 01:00 = 北京时间 1 日 09:00；
    # 若写成 18:00 UTC，落到北京已经是 2 号凌晨了。
    - cron: "0 1 1 * *"   # UTC 每月 1 日 01:00 = 北京时间每月 1 日 09:00

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream and push to fork
        # 只在 main 上同步上游；在特性分支上手跑时按分支原样构建，避免把分支推到 main。
        if: github.ref == 'refs/heads/main'
        run: |
          # git 身份必须显式设置：checkout 出来的仓库没有 user.name/user.email，
          # 合并需要创建 merge commit 时会报 "fatal: empty ident name ... not allowed"，
          # 之前被 `|| true` 吞掉，导致 fork main 从 2026-08-29 起再没跟上过上游。
          git config user.name "qznet"
          git config user.email "qznet@users.noreply.github.com"
          git remote add upstream https://github.com/AnilBeesetti/nextplayer.git || git remote set-url upstream https://github.com/AnilBeesetti/nextplayer.git
          git fetch upstream main
          echo "上游落后/领先：$(git rev-list --left-right --count HEAD...upstream/main)"
          if git merge upstream/main --no-edit; then
            git push origin main
          else
            echo "::error::合并上游冲突，需人工解决后再构建（本次不做带冲突的构建）"
            git merge --abort || true
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with debug key, no secret needed)
        # 默认只出 armeabi-v7a；需要全量传 all（workflow_dispatch 选 all，或 ./gradlew ... -PnextplayerAbis=all）。
        env:
          ABIS: ${{ github.event.inputs.abis || 'v7a' }}
        run: ./gradlew assembleRelease-with-debug-signing -PnextplayerAbis="$ABIS" --stacktrace

      - name: Upload APK artifacts
        # 无论 release 发布是否成功，构建产物都能从 run 的 artifact 下载。
        uses: actions/upload-artifact@v4
        with:
          name: nextplayer-apks
          path: app/build/outputs/apk/release-with-debug-signing/*.apk
          if-no-files-found: error

      - name: Publish / update latest release
        # 只有 main 的构建才更新 latest，分支验证构建只留 artifact，避免半成品被当成正式包。
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: qznet/nextplayer
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          # checkout 带 fetch-depth: 0，本地可能还留着 latest 标签；
          # 不删掉的话 gh release create 会报 "tag latest exists locally but has not been pushed"。
          git tag -d latest || true
          NOTES=$(cat <<'EOF'
          自动同步上游 AnilBeesetti/nextplayer 最新代码，叠加本 fork 的改造：

          **1. 遥控器调速**
          全屏播放 DPAD_UP/DOWN 按 0.1 步进调倍速（0.2~4.0），带 Toast 提示。

          **2. 音频管线按速度自动切换（无任何设置开关）**
          - 1.0 倍速：压缩音轨（AC3 / E-AC3）**原样直通**给功放，5.1 / Atmos 由功放解码，
            HAL 侧是 `OFFLOAD + E_AC3 + 6ch`。
          - 非 1.0 倍速：关闭直通 → 解码成 PCM，下混为 2 声道交给 Sonic 变速，
            音画同步；折叠矩阵保留中置 / 环绕，LFE 按 -9dB 保留（不发薄）。
          - 回到 1.0 倍速稳住 3 秒后自动恢复码流直通，期间来回连按不会反复切换。
          - 重选额度是 2 秒 / 4 次的滑动窗口，**不会用完就永久失效**。

          **3. 稳定性**
          - 直通闸门只拦「本机真能解码」的格式（DTS / TrueHD 继续给 ARC，不制造静音）。
          - 音轨被临时禁用后有超时恢复 + 校验 + 看门狗三道保险，卡死能自愈。
          - Dolby Vision 保持交给系统 DV 解码器；FFmpeg 扩展渲染器保持「核心优先」。

          包名 dev.anilbeesetti.nextplayer.release（debug key 签名）。
          ABI 策略：日常/测试构建默认只出 armeabi-v7a；只有正式版发布或明确指定时才出全量（arm64-v8a / x86 / universal）。
          上游每次有更新，本 release 会自动重建。
          EOF
          )
          gh release create latest \
            --target main \
            --title "NextPlayer TV 版 v0.19.5（上下键倍速 + 按速度切换音频管线 + dpadUpDown 可选调速）" \
            --notes "$NOTES" \
            app/build/outputs/apk/release-with-debug-signing/*.apk
